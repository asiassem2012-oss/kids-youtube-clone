<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="bdd1bf25ef631b45eebadaa4779fb07569feda2c" content="bdd1bf25ef631b45eebadaa4779fb07569feda2c" /> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشاهدة الفيديو - YouTube Clone</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <style>
        /* تنسيقات حاوية الفيديو والإعلان */
        .video_player_box {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* نسبة 16:9 */
            background: #000;
        }

        .video_player_box iframe,
        .ad_preroll_overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* طبقة إعلان الـ Pre-roll */
        .ad_preroll_overlay {
            z-index: 10;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .ad_skip_btn {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            border: 1px solid #fff;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            z-index: 11;
        }

        .ad_skip_btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .ad_badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #fbc02d;
            color: #000;
            padding: 4px 8px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 2px;
            z-index: 11;
        }
    </style>
</head>
<body>
    <!-- ===== شريط التنقل ===== -->
    <header class="header">
        <div class="header-left">
            <i class="material-icons" onclick="window.location.href='index.html'">arrow_back</i>
            <div class="logo">YouTube <span>Clone</span></div>
        </div>
        <div class="header-center">
            <input type="text" id="search_input" placeholder="بحث...">
            <button><i class="material-icons">search</i></button>
        </div>
        <div class="header-right">
            <button id="login_btn" style="background:#065fd4; color:#fff; border:none; padding:6px 12px; border-radius:18px; cursor:pointer; font-weight:bold;">تسجيل الدخول</button>
            <span id="user_status" style="display:none; font-size:12px; padding:4px 8px; border-radius:4px; font-weight:bold;"></span>
            <i class="material-icons" id="parent_btn" title="الرقابة الأبوية">timer</i>
            <i class="material-icons">video_call</i>
            <i class="material-icons">notifications</i>
            <img src="images/profile.jpg" alt="profile" class="header-avatar">
        </div>
    </header>

    <!-- ===== محتوى المشاهدة ===== -->
    <div class="watch_container">
        <div class="main_video">
            <div class="video_player_box">
                <!-- طبقة إعلان Pre-roll -->
                <div id="preroll_ad" class="ad_preroll_overlay">
                    <span class="ad_badge">إعلان</span>
                    <a id="ad_click_link" href="#" target="_blank" style="width:100%; height:100%; display:block;">
                        <video id="ad_video_player" autoplay muted playsinline style="width:100%; height:100%; object-fit:contain;">
                            <!-- فيديو افتراضي للإعلان -->
                            <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4" type="video/mp4">
                        </video>
                    </a>
                    <button id="skip_ad_btn" class="ad_skip_btn" disabled>يمكنك التخطي بعد 5</button>
                </div>

                <!-- مشغل فيديو YouTube الأصلي -->
                <iframe 
                    id="main_youtube_iframe"
                    src="" 
                    title="YouTube Video Player" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
                </iframe>
            </div>

            <!-- مكان البنر الإعلاني تحت المشغل -->
            <div id="watch-ad-zone" style="text-align: center; margin: 15px 0; min-height: 90px;"></div>

            <h2 class="watch_title">جاري تحميل العنوان...</h2>
            <div class="video_details_bar">
                <div class="channel_info">
                    <img src="images/profile.jpg" alt="Channel" id="channel_pic">
                    <div>
                        <h3 id="channel_name">Assem Code</h3>
                        <span id="subscribers_count">150K Subscribers</span>
                    </div>
                    <button id="subscribe_btn" class="subscribe_btn">Subscribe</button>
                </div>
                <div class="video_actions">
                    <button id="like_btn" class="action_btn">
                        <i class="material-icons">thumb_up</i>
                        <span id="likes_count">12000</span>
                    </button>
                    <button class="action_btn">
                        <i class="material-icons">share</i> Share
                    </button>
                </div>
            </div>
        </div>

        <div class="recommended_videos" id="recommended_container">
            <!-- تحميل عبر JavaScript -->
        </div>
    </div>

    <!-- ===== Firebase ===== -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        // رابط VAST الخاص بـ HilltopAds
        const vastUrl = "https://gloomy-association.com/dOm.FqzYdMGJNSvQZDGAUo/AeCmb9-u/Z/UtlBkLPQTncXz/NWDPke3MMXDxUKtNNIznMA0JOTTHcAw/OgQJ";

        const prerollAd = document.getElementById('preroll_ad');
        const adVideoPlayer = document.getElementById('ad_video_player');
        const skipAdBtn = document.getElementById('skip_ad_btn');
        const adClickLink = document.getElementById('ad_click_link');
        const mainIframe = document.getElementById('main_youtube_iframe');

        // جلب واستخراج رابط الفيديو والصفحة المستهدفة من رابط VAST XML
        async function fetchVastAd() {
            try {
                const response = await fetch(vastUrl);
                const xmlText = await response.text();
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xmlText, "text/xml");

                // استخراج رابط الفيديو MP4 من ملف الـ XML
                const mediaFiles = xmlDoc.getElementsByTagName("MediaFile");
                let videoSrc = "";
                for (let i = 0; i < mediaFiles.length; i++) {
                    if (mediaFiles[i].getAttribute("type") === "video/mp4") {
                        videoSrc = mediaFiles[i].textContent.trim();
                        break;
                    }
                }

                // استخراج رابط توجيه الضغط (ClickThrough)
                const clickThrough = xmlDoc.getElementsByTagName("ClickThrough")[0];
                if (clickThrough) {
                    adClickLink.href = clickThrough.textContent.trim();
                } else {
                    adClickLink.href = vastUrl;
                }

                if (videoSrc) {
                    adVideoPlayer.src = videoSrc;
                    adVideoPlayer.play();
                }
            } catch (error) {
                console.warn("لم يتم تحميل VAST XML، يتم استخدام الإعلان الافتراضي:", error);
            }
        }

        // إدارة مؤقت زر التخطي (5 ثوانٍ)
        let countdown = 5;
        const timer = setInterval(() => {
            countdown--;
            if (countdown > 0) {
                skipAdBtn.innerText = `يمكنك التخطي بعد ${countdown}`;
            } else {
                clearInterval(timer);
                skipAdBtn.innerText = "تخطي الإعلان";
                skipAdBtn.disabled = false;
            }
        }, 1000);

        // وظيفة إغلاق الإعلان وتشغيل الفيديو الأصلي
        function closeAd() {
            prerollAd.style.display = 'none';
            adVideoPlayer.pause();
            
            // إضافة خاصية autoplay للـ iframe بعد إغلاق الإعلان
            if (mainIframe.src && !mainIframe.src.includes('autoplay=1')) {
                const separator = mainIframe.src.includes('?') ? '&' : '?';
                mainIframe.src += `${separator}autoplay=1`;
            }
        }

        skipAdBtn.addEventListener('click', closeAd);
        adVideoPlayer.addEventListener('ended', closeAd);

        // جلب الإعلان عند تحميل الصفحة
        window.addEventListener('DOMContentLoaded', fetchVastAd);

        // ===== إعدادات Firebase =====
        const firebaseConfig = {
            apiKey: "AIzaSyBDIAFYC_cyQJKUPTAbNbFWKaay_iss7ls",
            authDomain: "yotube-clone-72a6d.firebaseapp.com",
            projectId: "yotube-clone-72a6d",
            storageBucket: "yotube-clone-72a6d.firebasestorage.app",
            messagingSenderId: "237883115992",
            appId: "1:237883115992:web:2aef12d44925a8dd470aad",
            measurementId: "G-06GW1D9DQV"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        const loginBtn = document.getElementById('login_btn');
        loginBtn.addEventListener('click', () => {
            if (auth.currentUser) {
                auth.signOut();
            } else {
                const provider = new firebase.auth.GoogleAuthProvider();
                auth.signInWithRedirect(provider);
            }
        });
    </script>
    <script src="script.js"></script>
  
</body>
</html>
