<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>مشاهدة الفيديو - YouTube Clone</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />

    <!-- مشغل الفيديو Video.js مع دعم VAST -->
    <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />
    <script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/videojs-vast-plugin@1.9.0/dist/videojs-vast.min.js"></script>
</head>
<body>
    <!-- شريط التنقل (نفس الموجود في index) -->
    <header class="header">
        <div class="header-left">
            <i class="material-icons" onclick="window.location.href='index.html'">arrow_back</i>
            <div class="logo">YouTube <span>Clone</span></div>
        </div>
        <div class="header-center">
            <input type="text" id="search_input" placeholder="بحث..." />
            <button><i class="material-icons">search</i></button>
        </div>
        <div class="header-right">
            <button id="login_btn" style="background:#065fd4; color:#fff; border:none; padding:6px 12px; border-radius:18px; cursor:pointer; font-weight:bold;">تسجيل الدخول</button>
            <span id="user_status" style="display:none; font-size:12px; padding:4px 8px; border-radius:4px; font-weight:bold;"></span>
            <i class="material-icons" id="parent_btn" title="الرقابة الأبوية">timer</i>
            <i class="material-icons">video_call</i>
            <i class="material-icons">notifications</i>
            <img src="images/profile.jpg" alt="profile" class="header-avatar" />
        </div>
    </header>

    <!-- محتوى المشاهدة -->
    <div class="watch_container">
        <div class="main_video">
            <!-- مشغل الفيديو الجديد -->
            <div class="video_player_box">
                <video-js id="my-video" class="vjs-default-skin vjs-big-play-centered"
                    controls preload="auto" width="100%" height="auto">
                    <source id="videoSource" src="" type="video/mp4" />
                </video-js>
            </div>

            <h2 class="watch_title" id="watchTitle">جاري تحميل العنوان...</h2>
            <div class="video_details_bar">
                <div class="channel_info">
                    <img src="images/profile.jpg" alt="Channel" id="channel_pic" />
                    <div>
                        <h3 id="channel_name">Assem Code</h3>
                        <span id="subscribers_count">150K Subscribers</span>
                    </div>
                    <button id="subscribe_btn" class="subscribe_btn">Subscribe</button>
                </div>
                <div class="video_actions">
                    <button id="like_btn" class="action_btn">
                        <i class="material-icons">thumb_up</i>
                        <span id="likes_count">12000</span>
                    </button>
                    <button class="action_btn">
                        <i class="material-icons">share</i> Share
                    </button>
                </div>
            </div>
        </div>

        <div class="recommended_videos" id="recommended_container">
            <!-- سيتم تحميلها بواسطة JavaScript -->
        </div>
    </div>

    <!-- شاشة القفل الأبوي -->
    <div id="parent_overlay" class="parent_overlay" style="display: none;">
        <div class="overlay_card">
            <i class="material-icons">lock</i>
            <h2>انتهى وقت المشاهدة المسموح به اليوم!</h2>
            <p>يرجى العودة غداً أو طلب إذن ولي الأمر للفتح.</p>
            <div class="pin_box">
                <input type="password" id="parent_pin_input" placeholder="أدخل رمز PIN" />
                <button id="unlock_btn">إلغاء القفل</button>
            </div>
        </div>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script>
        // إعدادات Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBDIAFYC_cyQJKUPTAbNbFWKaay_iss7ls",
            authDomain: "yotube-clone-72a6d.firebaseapp.com",
            projectId: "yotube-clone-72a6d",
            storageBucket: "yotube-clone-72a6d.firebasestorage.app",
            messagingSenderId: "237883115992",
            appId: "1:237883115992:web:2aef12d44925a8dd470aad",
            measurementId: "G-06GW1D9DQV"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // تسجيل الدخول
        const loginBtn = document.getElementById('login_btn');
        const userStatus = document.getElementById('user_status');

        async function updateUI(user) {
            if (user) {
                loginBtn.innerText = "تسجيل الخروج";
                try {
                    const doc = await db.collection('users').doc(user.uid).get();
                    if (doc.exists && doc.data().isPro) {
                        userStatus.style.display = 'inline-block';
                        userStatus.style.background = '#d4edda';
                        userStatus.style.color = '#155724';
                        userStatus.innerText = 'حساب مميز ⭐ Pro';
                    } else {
                        userStatus.style.display = 'inline-block';
                        userStatus.style.background = '#e2e3e5';
                        userStatus.style.color = '#383d41';
                        userStatus.innerText = 'حساب مجاني';
                        if (!doc.exists) {
                            await db.collection('users').doc(user.uid).set({
                                name: user.displayName,
                                email: user.email,
                                isPro: false
                            });
                        }
                    }
                } catch (err) { console.warn(err); }
            } else {
                loginBtn.innerText = "تسجيل الدخول";
                userStatus.style.display = 'none';
            }
        }

        loginBtn.addEventListener('click', () => {
            if (auth.currentUser) {
                auth.signOut();
            } else {
                const provider = new firebase.auth.GoogleAuthProvider();
                auth.signInWithPopup(provider);
            }
        });

        auth.onAuthStateChanged((user) => { updateUI(user); });

        // ===== دالة تحميل الفيديو =====
        function loadWatchPage() {
            const urlParams = new URLSearchParams(window.location.search);
            const videoId = urlParams.get('id');
            const titleEl = document.getElementById('watchTitle');
            const iframe = document.querySelector('.video_player_box iframe');
            const videoSource = document.getElementById('videoSource');
            const player = videojs('my-video', {
                controls: true,
                autoplay: false,
                preload: 'auto'
            });

            if (!videoId) {
                titleEl.innerText = 'معرف الفيديو غير موجود';
                return;
            }

            db.collection('videos').doc(videoId).get()
                .then(doc => {
                    if (!doc.exists) {
                        titleEl.innerText = 'الفيديو غير موجود';
                        return;
                    }
                    const video = { id: doc.id, ...doc.data() };
                    document.title = `${video.title} - YouTube Clone`;
                    titleEl.innerText = video.title;

                    // تعيين مصدر الفيديو
                    const videoUrl = video.mp4Url || '';
                    if (videoUrl) {
                        videoSource.src = videoUrl;
                        player.src({ src: videoUrl, type: 'video/mp4' });
                    } else {
                        titleEl.innerText = 'رابط الفيديو غير متوفر';
                        return;
                    }

                    // تفعيل VAST
                    const vastUrl = "https://gloomy-association.com/dOm-F.zzdUGfNRvCZgGJUF/sejm/9SupZaUYlskMPQT-cJzyNUDOkj3jMuD_UutqNdzvMz0TO/TccCwiOkQU";
                    player.vast({
                        url: vastUrl,
                        playAdAlways: true,
                        adCancelable: false
                    });

                    player.ready(function() {
                        player.play();
                    });

                    // معلومات القناة
                    document.getElementById('channel_pic').src = video.profilePic || 'images/profile.jpg';
                    document.getElementById('channel_name').innerText = video.creator || 'Assem Code';

                    // تحميل المقترحات
                    loadRecommendations(videoId);
                })
                .catch(err => {
                    console.error('خطأ في تحميل الفيديو:', err);
                    titleEl.innerText = 'حدث خطأ في التحميل';
                });
        }

        function loadRecommendations(currentId) {
            const recContainer = document.getElementById('recommended_container');
            if (!recContainer) return;

            db.collection('videos').limit(20).get()
                .then(snapshot => {
                    let html = '';
                    snapshot.forEach(doc => {
                        const v = { id: doc.id, ...doc.data() };
                        if (v.id === currentId) return;
                        const thumb = v.thumbnail || `https://img.youtube.com/vi/${v.youtubeId}/hqdefault.jpg`;
                        html += `
                            <div class="side_video">
                                <a href="watch.html?id=${v.id}">
                                    <img src="${thumb}" alt="${v.title}">
                                </a>
                                <div class="side_video_info">
                                    <a href="watch.html?id=${v.id}">${v.title}</a>
                                    <p>${v.creator || 'غير معروف'}</p>
                                    <span>${v.views || '0 views'}</span>
                                </div>
                            </div>
                        `;
                    });
                    recContainer.innerHTML = html || '<p style="color:var(--text-secondary);">لا توجد مقترحات</p>';
                })
                .catch(() => {
                    recContainer.innerHTML = '<p style="color:var(--text-secondary);">حدث خطأ في تحميل المقترحات</p>';
                });
        }

        document.addEventListener('DOMContentLoaded', loadWatchPage);
    </script>
</body>
</html>
