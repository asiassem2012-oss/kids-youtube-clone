<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="bdd1bf25ef631b45eebadaa4779fb07569feda2c" content="bdd1bf25ef631b45eebadaa4779fb07569feda2c" /> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشاهدة الفيديو - YouTube Clone</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <!-- مكتبة Fluid Player لدعم إعلانات VAST -->
    <script src="https://cdn.fluidplayer.com/v3/current/fluidplayer.min.js"></script>
    
    <style>
        .video_player_box {
            position: relative;
            width: 100%;
            background: #000;
        }
        .video_player_box video, .video_player_box iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <!-- ===== شريط التنقل ===== -->
    <header class="header">
        <div class="header-left">
            <i class="material-icons" onclick="window.location.href='index.html'">arrow_back</i>
            <div class="logo">YouTube <span>Clone</span></div>
        </div>
        <div class="header-center">
            <input type="text" id="search_input" placeholder="بحث...">
            <button><i class="material-icons">search</i></button>
        </div>
        <div class="header-right">
            <button id="login_btn" style="background:#065fd4; color:#fff; border:none; padding:6px 12px; border-radius:18px; cursor:pointer; font-weight:bold;">تسجيل الدخول</button>
            <span id="user_status" style="display:none; font-size:12px; padding:4px 8px; border-radius:4px; font-weight:bold;"></span>
            <i class="material-icons" id="parent_btn" title="الرقابة الأبوية">timer</i>
            <i class="material-icons">video_call</i>
            <i class="material-icons">notifications</i>
            <img src="images/profile.jpg" alt="profile" class="header-avatar">
        </div>
    </header>

    <!-- ===== محتوى المشاهدة ===== -->
    <div class="watch_container">
        <div class="main_video">
            <div class="video_player_box" id="player_wrapper">
                <!-- مشغل فيديو يدعم الـ VAST الإعلاني -->
                <video id="my_video_player">
                    <source src="" type="video/mp4"/>
                </video>
            </div>

            <!-- مكان الإعلان تحت الفيديو -->
            <div id="watch-ad-zone" style="text-align: center; margin: 15px 0; min-height: 90px; background: #f9f9f9;"></div>

            <h2 class="watch_title">جاري تحميل العنوان...</h2>
            <div class="video_details_bar">
                <div class="channel_info">
                    <img src="images/profile.jpg" alt="Channel" id="channel_pic">
                    <div>
                        <h3 id="channel_name">Assem Code</h3>
                        <span id="subscribers_count">150K Subscribers</span>
                    </div>
                    <button id="subscribe_btn" class="subscribe_btn">Subscribe</button>
                </div>
                <div class="video_actions">
                    <button id="like_btn" class="action_btn">
                        <i class="material-icons">thumb_up</i>
                        <span id="likes_count">12000</span>
                    </button>
                    <button class="action_btn">
                        <i class="material-icons">share</i> Share
                    </button>
                </div>
            </div>
        </div>

        <div class="recommended_videos" id="recommended_container">
            <!-- تحميل عبر JavaScript -->
        </div>
    </div>

    <!-- ===== Firebase ===== -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        // تشغيل مشغل Fluid Player مع كود الـ VAST الخاص بك
        const vastTagUrl = "https://gloomy-association.com/dOm.FqzYdMGJNSvQZDGAUo/AeCmb9-u/Z/UtlBkLPQTncXz/NWDPke3MMXDxUKtNNIznMA0JOTTHcAw/OgQJ";

        const player = fluidPlayer('my_video_player', {
            vastOptions: {
                adList: [
                    {
                        roll: 'preRoll', // إعلان قبل بداية الفيديو
                        vastTag: vastTagUrl,
                        timer: 5 // إمكانية التخطي بعد 5 ثواني
                    }
                ]
            },
            layoutControls: {
                autoPlay: true,
                mute: false
            }
        });

        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyBDIAFYC_cyQJKUPTAbNbFWKaay_iss7ls",
            authDomain: "yotube-clone-72a6d.firebaseapp.com",
            projectId: "yotube-clone-72a6d",
            storageBucket: "yotube-clone-72a6d.firebasestorage.app",
            messagingSenderId: "237883115992",
            appId: "1:237883115992:web:2aef12d44925a8dd470aad",
            measurementId: "G-06GW1D9DQV"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        const loginBtn = document.getElementById('login_btn');
        if (loginBtn) {
            loginBtn.addEventListener('click', () => {
                if (auth.currentUser) {
                    auth.signOut();
                } else {
                    const provider = new firebase.auth.GoogleAuthProvider();
                    auth.signInWithRedirect(provider);
                }
            });
        }
    </script>
    <script src="script.js"></script>
</body>
</html>
